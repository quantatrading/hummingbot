name: Crypto.com Commit Tester

on:
  push:
    branches:
      - "**"
    paths:
      - "hummingbot/connector/exchange/cryptocom/**"
      - "scripts/exchange_test.py"
      - ".github/workflows/cryptocom_commit_tester.yml"
  pull_request:
    branches:
      - master
      - development
    paths:
      - "hummingbot/connector/exchange/cryptocom/**"
      - "scripts/exchange_test.py"
      - ".github/workflows/cryptocom_commit_tester.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate connector contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Crypto.com connector files
        run: |
          python -m py_compile hummingbot/connector/exchange/cryptocom/*.py

      - name: Compile exchange test script
        run: |
          python -m py_compile scripts/exchange_test.py

      - name: Validate Crypto.com public REST endpoints
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          checks = [
              "https://api.crypto.com/exchange/v1/public/get-time",
              "https://api.crypto.com/exchange/v1/public/get-instruments",
              "https://api.crypto.com/exchange/v1/public/get-book?" + urllib.parse.urlencode({"instrument_name": "BTC_USD", "depth": 10}),
              "https://api.crypto.com/exchange/v1/public/get-trades?" + urllib.parse.urlencode({"instrument_name": "BTC_USD"}),
          ]

          for url in checks:
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              code = payload.get("code")
              if code != 0:
                  raise SystemExit(f"Endpoint failed: {url} -> code={code}, payload={payload}")

          print("Crypto.com public REST checks passed.")
          PY
